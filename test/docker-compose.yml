services:
  safenet-auth-api:
    image: thalesdemo/safenet-auth-api:0.2.0-arm64
    container_name: safenet-auth-api
    environment:
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY-}
      API_SERVER_PORT: ${API_SERVER_PORT}
      JCRYPTO_INI_PATH: /app/config/config.ini
      SAFENET_PRIMARY_AUTH_URL: ${SAFENET_PRIMARY_AUTH_URL}
    volumes:
      - type: bind
        source: ${HOST_AGENT_KEY_PATH}
        target: /app/secret/agent.key
        read_only: true
      - type: bind
        source: ${APPLICATION_YAML_PATH}
        target: /app/config/application.yml
        read_only: true
      - type: bind
        source: ${HOST_TLS_PKCS12_PATH}
        target: /app/secret/server.p12
        read_only: true
    ports:
      - ${API_SERVER_PORT}:${API_SERVER_PORT}
